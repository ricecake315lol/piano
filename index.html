<!DOCTYPE html>
<html>
<head>
  <title>Piano Tiles</title>

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 40px;
    }

    .piano {
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }

    .key {
      width: 60px;
      height: 220px;
      background: white;
      border: 2px solid black;
      border-radius: 0 0 8px 8px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 15px;
      box-sizing: border-box;
      user-select: none;
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .key.pressed {
      background: #ddd;
      transform: translateY(5px);
    }

    .white {
      width: 60px;
      height: 220px;
      background: white;
      border: 2px solid black;
      z-index: 1;
    }

    .black {
      width: 40px;
      height: 140px;
      background: black;
      color: white;
      margin-left: -20px;
      margin-right: -20px;
      z-index: 2;
      border: 2px solid black;
      border-radius: 0 0 6px 6px;
      padding-bottom: 15px;
    }

    #secretButton {
      position: fixed;
      bottom: 15px;
      right: 15px;
    }
  </style>
</head>

<body>

  <h1>Welcome to Piano Tiles!</h1>
  <p>Have fun playing the piano online!</p>
  
  <button id="secretButton">Extras</button>

  <div class="piano">
    <div class="key white">C</div>
    <div class="key black">C#</div>

    <div class="key white">D</div>
    <div class="key black">D#</div>

    <div class="key white">E</div>

    <div class="key white">F</div>
    <div class="key black">F#</div>

    <div class="key white">G</div>
    <div class="key black">G#</div>

    <div class="key white">A</div>
    <div class="key black">A#</div>

    <div class="key white">B</div>
    <div class="key white">C5</div>
  </div>

  <script>
    const secretButton = document.getElementById("secretButton");
    let extrasMode = false;

    let secretSequence = [];
    const correctSequence = ["F", "A", "G", "C"];

    secretButton.addEventListener("click", () => {
    extrasMode = !extrasMode;

      if (extrasMode) {
        secretButton.textContent = "Extras: ON";
        console.log("Secret mode activated!");
      } else {
        secretButton.textContent = "Extras";
        console.log("Secret mode deactivated!");
      }
    });
    const keys = document.querySelectorAll(".key");
    let mouseDown = false;

    const sounds = {
      C: new Audio("sounds/334538__teddy_frost__c4.wav"),
      "C#": new Audio("sounds/608990__smstrahan__csharp.mp3"),

      D: new Audio("sounds/334536__teddy_frost__piano-normal-d4.wav"),
      "D#": new Audio("sounds/608989__smstrahan__dsharp.mp3"),

      E: new Audio("sounds/334542__teddy_frost__e4.wav"),

      F: new Audio("sounds/334541__teddy_frost__f4.wav"),
      "F#": new Audio("sounds/608988__smstrahan__fsharp.mp3"),

      G: new Audio("sounds/334540__teddy_frost__g4.wav"),
      "G#": new Audio("sounds/608992__smstrahan__gsharp.mp3"),

      A: new Audio("sounds/334534__teddy_frost__piano-a4-sound.wav"),
      "A#": new Audio("sounds/608991__smstrahan__asharp.mp3"),

      B: new Audio("sounds/334539__teddy_frost__b4.wav"),
      C5: new Audio("sounds/334537__teddy_frost__c5.wav")
    };

  function playNote(key) {
    const note = key.textContent.trim();
    const sound = sounds[note];

  if (sound) {
    sound.currentTime = 0;
    sound.play();
  }

  // Secret sequence
  if (extrasMode) {
    secretSequence.push(note);

    // Keep only the last 4 notes
    if (secretSequence.length > correctSequence.length) {
      secretSequence.shift();
    }

    // Check if the sequence is correct
    if (secretSequence.join(",") === correctSequence.join(",")) {
      console.log("SECRET UNLOCKED!");
      
      // This is where we'll send the player to the games page later
    }
  }
}

    document.addEventListener("mousedown", () => {
      mouseDown = true;
    });

    document.addEventListener("mouseup", () => {
      mouseDown = false;

      keys.forEach(key => {
        key.classList.remove("pressed");
      });
    });

    keys.forEach(key => {

      // Normal click
      key.addEventListener("mousedown", () => {
        key.classList.add("pressed");
        playNote(key);
      });

      // Drag across keys
      key.addEventListener("mouseenter", () => {
        if (mouseDown) {
          key.classList.add("pressed");
          playNote(key);
        }
      });

      // Release while over a key
      key.addEventListener("mouseup", () => {
        key.classList.remove("pressed");
      });

      // Remove the effect when leaving a key
      key.addEventListener("mouseleave", () => {
        if (!mouseDown) {
          key.classList.remove("pressed");
        }
      });

    });
  </script>

</body>
</html>
