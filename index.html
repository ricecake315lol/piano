<!DOCTYPE html>
<html>
<head>
  <title>Piano Tiles</title>

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 40px;
    }

    .piano {
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }

    .key {
      width: 60px;
      height: 220px;
      background: white;
      border: 2px solid black;
      border-radius: 0 0 8px 8px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 15px;
      box-sizing: border-box;
      user-select: none;
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .key.pressed {
      background: #ddd;
      transform: translateY(5px);
    }
  </style>
</head>

<body>

  <h1>Welcome to Piano Tiles!</h1>
  <p>Have fun playing the piano online!</p>

  <div class="piano">
    <div class="key">C</div>
    <div class="key">D</div>
    <div class="key">E</div>
    <div class="key">F</div>
    <div class="key">G</div>
    <div class="key">A</div>
    <div class="key">B</div>
  </div>

<script>
    const keys = document.querySelectorAll(".key");
    let mouseDown = false;

    const sounds = {
        C: new Audio("sounds/C.mp3"),
        D: new Audio("sounds/D.mp3"),
        E: new Audio("sounds/E.mp3"),
        F: new Audio("sounds/F.mp3"),
        G: new Audio("sounds/G.mp3"),
        A: new Audio("sounds/A.mp3"),
        B: new Audio("sounds/B.mp3")
    };

    function playNote(key) {
        const sound = sounds[key.textContent.trim()];

        if (sound) {
            sound.currentTime = 0;
            sound.play();
        }
    }

    document.addEventListener("mousedown", () => {
        mouseDown = true;
    });

    document.addEventListener("mouseup", () => {
        mouseDown = false;

        keys.forEach(key => {
            key.classList.remove("pressed");
        });
    });

    keys.forEach(key => {

        key.addEventListener("mousedown", () => {
            key.classList.add("pressed");
            playNote(key);
        });

        key.addEventListener("mouseenter", () => {
            if (mouseDown) {
                key.classList.add("pressed");
                playNote(key);
            }
        });

        key.addEventListener("mouseup", () => {
            key.classList.remove("pressed");
        });

        key.addEventListener("mouseleave", () => {
            if (!mouseDown) {
                key.classList.remove("pressed");
            }
        });

    });
</script>

</body>
</html>
