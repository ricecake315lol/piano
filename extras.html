<!DOCTYPE html>
<html>
<head>
  <title>Extras</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #17152b;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 50px;
      font-size: 40px;
    }

    p {
      color: #bdb9d8;
    }

    .games {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 50px auto;
      max-width: 900px;
    }

    .game {
      width: 220px;
      height: 140px;
      background: #292544;
      border: 2px solid #4b4375;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      font-size: 20px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .game:hover {
      background: #37315c;
      transform: translateY(-5px);
    }
  </style>
</head>

<body>

  <h1>Extras</h1>
  <p>Play games here.</p>

  <div class="games">

 <div class="games">

  <div class="game">
    <iframe
      src="https://math.geet.in.net/get/among-us/game.html"
      width="800"
      height="600"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

</div>
    <a class="game" href="#">
      Game 2
    </a>

    <a class="game" href="#">
      Game 3
    </a>

    <a class="game" href="#">
      Game 4
    </a>

  </div>

</body>
</html>
